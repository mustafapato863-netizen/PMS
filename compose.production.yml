name: pms-dashboard

x-backend-environment: &backend-environment
  APP_ENV: production
  PORT: "7860"
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-0}
  DATABASE_POOL_RECYCLE: ${DATABASE_POOL_RECYCLE:-1800}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-0.25}
  REDIS_RETRY_INTERVAL_SECONDS: ${REDIS_RETRY_INTERVAL_SECONDS:-30}
  PMS_REALTIME_MODE: ${PMS_REALTIME_MODE:-in_process}
  PMS_AUTO_SEED: "false"
  PMS_SEED_PERMISSIONS_ON_STARTUP: "false"
  PMS_SEED_DEMO_LEVELS: "false"
  PMS_DATA_DIR: /app/data
  PMS_DEFAULT_FILE_PATH: /app/data/PMS_Trend_All.xlsx
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
  ENABLE_FILE_LOGGING: "false"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - private

  migrate:
    image: pms-backend:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: DevOps/docker/Dockerfile.backend
    command: ["sh", "-c", "python scripts/bootstrap_schema.py && alembic upgrade head"]
    environment: *backend-environment
    restart: "no"
    networks:
      - egress

  backend:
    image: pms-backend:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: DevOps/docker/Dockerfile.backend
    environment: *backend-environment
    volumes:
      - backend_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/api/health/readiness')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - private
      - egress

  frontend:
    image: pms-frontend:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: DevOps/docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
        VITE_REALTIME_ENABLED: ${VITE_REALTIME_ENABLED:-true}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - public

  gateway:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./DevOps/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - public
      - private

networks:
  public:
  private:
    internal: true
  egress:

volumes:
  redis_data:
  backend_data:
  caddy_data:
  caddy_config:
