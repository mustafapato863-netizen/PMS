name: pms-dashboard

x-backend-environment: &backend-environment
  APP_ENV: production
  PORT: "7860"
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
  DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-10}
  DATABASE_POOL_RECYCLE: ${DATABASE_POOL_RECYCLE:-1800}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-0.25}
  REDIS_RETRY_INTERVAL_SECONDS: ${REDIS_RETRY_INTERVAL_SECONDS:-30}
  # The gateway reaches the backend over the private subnet below. Only that proxy's X-Forwarded-For is honored.
  PMS_TRUSTED_PROXY_CIDRS: ${PMS_TRUSTED_PROXY_CIDRS:-10.218.10.0/24}
  PMS_REALTIME_MODE: ${PMS_REALTIME_MODE:-in_process}
  PMS_ASYNC_JOBS_ENABLED: ${PMS_ASYNC_JOBS_ENABLED:-true}
  PMS_REPORT_CENTER_ENABLED: ${PMS_REPORT_CENTER_ENABLED:-false}
  PMS_SCOPED_PERFORMANCE_API_ENABLED: ${PMS_SCOPED_PERFORMANCE_API_ENABLED:-false}
  PMS_SCOPED_PERFORMANCE_ALLOWED_ROLES: ${PMS_SCOPED_PERFORMANCE_ALLOWED_ROLES:-}
  PMS_JOB_POLL_SECONDS: ${PMS_JOB_POLL_SECONDS:-1}
  PMS_JOB_LEASE_SECONDS: ${PMS_JOB_LEASE_SECONDS:-300}
  PMS_JOB_MAX_ATTEMPTS: ${PMS_JOB_MAX_ATTEMPTS:-3}
  PMS_AUTO_SEED: "false"
  PMS_SEED_PERMISSIONS_ON_STARTUP: "false"
  PMS_SEED_DEMO_LEVELS: "false"
  PMS_JOB_DATA_DIR: /app/job_data
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10}
  AUTH_REFRESH_SESSION_HOURS: ${AUTH_REFRESH_SESSION_HOURS:-8}
  AUTH_REMEMBER_SESSION_DAYS: ${AUTH_REMEMBER_SESSION_DAYS:-30}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
  AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-none}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
  ENABLE_FILE_LOGGING: "false"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Self-hosted model. The llm service stays off unless Compose is started with --profile llm.
  # Override every value in Dokploy or the Hostinger env file. Empty API key sends no Authorization header.
  PMS_AI_LLM_BASE_URL: ${PMS_AI_LLM_BASE_URL:-http://pms-qwen-pilot:8080}
  PMS_AI_LLM_MODEL: ${PMS_AI_LLM_MODEL:-qwen3-4b-q4_k_m}
  PMS_AI_LLM_API_KEY: ${PMS_AI_LLM_API_KEY:-}
  PMS_AI_LLM_ALLOWED_HOSTS: ${PMS_AI_LLM_ALLOWED_HOSTS:-localhost,127.0.0.1,::1,llm,pms-qwen-pilot,host.docker.internal}
  PMS_AI_LLM_INTENT_ENABLED: ${PMS_AI_LLM_INTENT_ENABLED:-false}
  PMS_AI_LLM_SYNTHESIS_ENABLED: ${PMS_AI_LLM_SYNTHESIS_ENABLED:-false}
  PMS_AI_LLM_EXPLORATION_ENABLED: ${PMS_AI_LLM_EXPLORATION_ENABLED:-false}
  PMS_AI_LLM_TIMEOUT_SECONDS: ${PMS_AI_LLM_TIMEOUT_SECONDS:-15}
  PMS_AI_LLM_SYNTHESIS_TIMEOUT_SECONDS: ${PMS_AI_LLM_SYNTHESIS_TIMEOUT_SECONDS:-30}
  PMS_AI_LLM_MAX_CALLS_PER_TURN: ${PMS_AI_LLM_MAX_CALLS_PER_TURN:-3}
  PMS_AI_LLM_CONTEXT: ${PMS_AI_LLM_CONTEXT:-2048}
  PMS_RATE_LIMIT_AI_CHAT_PER_MINUTE: ${PMS_RATE_LIMIT_AI_CHAT_PER_MINUTE:-20}
  # Cloudflare Workers AI Primary & Google Gemini Fallback
  PMS_AI_PRIMARY_PROVIDER: ${PMS_AI_PRIMARY_PROVIDER:-cloudflare}
  PMS_AI_FALLBACK_PROVIDER: ${PMS_AI_FALLBACK_PROVIDER:-gemini}
  PMS_AI_CLOUDFLARE_ENABLED: ${PMS_AI_CLOUDFLARE_ENABLED:-true}
  PMS_AI_GEMINI_ENABLED: ${PMS_AI_GEMINI_ENABLED:-true}
  PMS_AI_FALLBACK_ENABLED: ${PMS_AI_FALLBACK_ENABLED:-true}
  PMS_AI_OPENAI_ENABLED: ${PMS_AI_OPENAI_ENABLED:-false}
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  CLOUDFLARE_AI_MODEL: ${CLOUDFLARE_AI_MODEL:-@cf/ibm-granite/granite-4.0-h-micro}
  CLOUDFLARE_AI_MODEL_ALTER: ${CLOUDFLARE_AI_MODEL_ALTER:-@cf/zai-org/glm-4.7-flash}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  PMS_GEMINI_MODEL: ${PMS_GEMINI_MODEL:-gemini-2.5-flash}

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - private

  migrate:
    image: pms-backend:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: DevOps/docker/Dockerfile.backend
    command: ["sh", "-c", "python -m scripts.bootstrap_schema && alembic upgrade head"]
    environment: *backend-environment
    restart: "no"
    networks:
      - egress

  backend:
    image: pms-backend:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: DevOps/docker/Dockerfile.backend
    environment: *backend-environment
    volumes:
      - job_data:/app/job_data
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/api/health/readiness')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - private
      - egress

  # Optional. A normal deploy does not start this. The live model is the standalone
  # container pms-qwen-pilot. Use this service only if that container is retired.
  llm:
    profiles: ["llm"]
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - -m
      - ${PMS_AI_LLM_MODEL_PATH:-/models/Qwen3-4B-Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${PMS_AI_LLM_CONTEXT:-2048}
      - --parallel
      - "1"
      - --threads
      - ${PMS_AI_LLM_THREADS:-1}
      - --n-gpu-layers
      - "0"
      - --alias
      - ${PMS_AI_LLM_MODEL:-qwen3-4b-q4_k_m}
    volumes:
      - ${PMS_AI_LLM_MODEL_DIR:-/opt/pms-qwen-pilot/models}:/models:ro
    mem_limit: ${PMS_AI_LLM_MEMORY_LIMIT:-3584m}
    cpus: ${PMS_AI_LLM_CPUS:-1}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/8080'"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped
    networks:
      - private

  worker:
    image: pms-backend:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: DevOps/docker/Dockerfile.backend
    command: ["sh", "-c", "exec python worker.py"]
    environment: *backend-environment
    volumes:
      - job_data:/app/job_data
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.worker_healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - private
      - egress

  frontend:
    image: pms-frontend:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: DevOps/docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
        VITE_REALTIME_ENABLED: ${VITE_REALTIME_ENABLED:-true}
        VITE_REPORT_CENTER_ENABLED: ${VITE_REPORT_CENTER_ENABLED:-false}
        VITE_SCOPED_PERFORMANCE_API: ${VITE_SCOPED_PERFORMANCE_API:-false}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - public

  gateway:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./DevOps/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - public
      - private

networks:
  public:
  private:
    internal: true
    # Fixed subnet so the backend can trust the gateway's address range. Override PMS_PRIVATE_SUBNET and
    # PMS_TRUSTED_PROXY_CIDRS together when this range collides with an existing network. See the deployment checklist.
    ipam:
      config:
        - subnet: ${PMS_PRIVATE_SUBNET:-10.218.10.0/24}
  egress:

volumes:
  redis_data:
  job_data:
  caddy_data:
  caddy_config:
