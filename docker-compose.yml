name: pms-backend-only

x-backend-environment: &backend-environment
  APP_ENV: production
  PORT: "7860"
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-0}
  DATABASE_POOL_RECYCLE: ${DATABASE_POOL_RECYCLE:-1800}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
  PMS_REALTIME_MODE: ${PMS_REALTIME_MODE:-in_process}
  PMS_ASYNC_JOBS_ENABLED: ${PMS_ASYNC_JOBS_ENABLED:-true}
  PMS_DATA_DIR: /app/data

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: DevOps/docker/Dockerfile.backend
    command: ["sh", "-c", "python scripts/bootstrap_schema.py && alembic upgrade head"]
    environment: *backend-environment
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: DevOps/docker/Dockerfile.backend
    environment: *backend-environment
    ports:
      - "7860:7860"
    volumes:
      - backend_data:/app/data
    depends_on:
      - redis
      - migrate
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: DevOps/docker/Dockerfile.backend
    command: ["sh", "-c", "exec python worker.py"]
    environment: *backend-environment
    volumes:
      - backend_data:/app/data
    depends_on:
      - redis
      - migrate
    restart: unless-stopped

volumes:
  redis_data:
  backend_data:
