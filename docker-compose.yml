name: pms-backend-only
x-backend-environment: &a1
  APP_ENV: production
  PORT: "7860"
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
  DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-10}
  DATABASE_POOL_RECYCLE: ${DATABASE_POOL_RECYCLE:-1800}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
  PMS_REALTIME_MODE: ${PMS_REALTIME_MODE:-in_process}
  PMS_ASYNC_JOBS_ENABLED: ${PMS_ASYNC_JOBS_ENABLED:-true}
  PMS_JOB_DATA_DIR: /app/job_data
  PMS_RATE_LIMIT_AI_CHAT_PER_MINUTE: ${PMS_RATE_LIMIT_AI_CHAT_PER_MINUTE:-20}
  PMS_AI_PRIMARY_PROVIDER: ${PMS_AI_PRIMARY_PROVIDER:-nvidia}
  PMS_AI_FALLBACK_PROVIDER: ${PMS_AI_FALLBACK_PROVIDER:-cloudflare}
  PMS_AI_CLOUDFLARE_ENABLED: ${PMS_AI_CLOUDFLARE_ENABLED:-true}
  PMS_AI_FALLBACK_ENABLED: ${PMS_AI_FALLBACK_ENABLED:-true}
  PMS_AI_OPENAI_ENABLED: ${PMS_AI_OPENAI_ENABLED:-false}
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  CLOUDFLARE_API_TOKEN_ALTER: ${CLOUDFLARE_API_TOKEN_ALTER:-}
  CLOUDFLARE_AI_MODEL: ${CLOUDFLARE_AI_MODEL:-@cf/ibm-granite/granite-4.0-h-micro}
  CLOUDFLARE_AI_MODEL_ALTER: ${CLOUDFLARE_AI_MODEL_ALTER:-@cf/zai-org/glm-4.7-flash}
  PMS_AI_FEEDBACK_ANALYZER_ENABLED: ${PMS_AI_FEEDBACK_ANALYZER_ENABLED:-false}
  PMS_AI_NVIDIA_ENABLED: ${PMS_AI_NVIDIA_ENABLED:-true}
  PMS_AI_NVIDIA_REASONING_EFFORT: ${PMS_AI_NVIDIA_REASONING_EFFORT:-auto}
  NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
  NVIDIA_API_KEY_ALTER: ${NVIDIA_API_KEY_ALTER:-}
  NVIDIA_API_BASE_URL: ${NVIDIA_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
  NVIDIA_FEEDBACK_MODEL: ${NVIDIA_FEEDBACK_MODEL:-nvidia/nemotron-3.5-super-vl-120b-a12b}
  PMS_AI_FEEDBACK_ANALYZER_TIMEOUT_SECONDS: ${PMS_AI_FEEDBACK_ANALYZER_TIMEOUT_SECONDS:-20}
  PMS_AI_FEEDBACK_ANALYZER_DAILY_LIMIT: ${PMS_AI_FEEDBACK_ANALYZER_DAILY_LIMIT:-50}
  PMS_SECRETS_ENCRYPTION_KEY: ${PMS_SECRETS_ENCRYPTION_KEY:-}
services:
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - yes
      - --requirepass
      - ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data
    restart: unless-stopped
    labels:
      - dokploy.organization.id=fHpOQZBWg5ovFVXv43-rO
      - dokploy.project.id=5ZhN_93WVKALyaZi8gUYg
      - dokploy.project=Performance Managment System
      - dokploy.environment.id=UfSrbdaM5u87u4LjRB13I
      - dokploy.environment=production
      - dokploy.application.id=uncof75r2DnwMD4KV5hed
      - dokploy.application=Backend
      - dokploy.service=redis
  migrate:
    build:
      context: .
      dockerfile: DevOps/docker/Dockerfile.backend
    command:
      - sh
      - -c
      - python -m scripts.bootstrap_schema && alembic upgrade head
    environment: *a1
    restart: no
    networks:
      - dokploy-network
      - default
    labels:
      - dokploy.organization.id=fHpOQZBWg5ovFVXv43-rO
      - dokploy.project.id=5ZhN_93WVKALyaZi8gUYg
      - dokploy.project=Performance Managment System
      - dokploy.environment.id=UfSrbdaM5u87u4LjRB13I
      - dokploy.environment=production
      - dokploy.application.id=uncof75r2DnwMD4KV5hed
      - dokploy.application=Backend
      - dokploy.service=migrate
  backend:
    build:
      context: .
      dockerfile: DevOps/docker/Dockerfile.backend
    environment: *a1
    # Traefik reaches port 7860 over dokploy-network; direct host access stays loopback-only.
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - job_data:/app/job_data
    # Do not start the API or job worker until database migrations have succeeded.
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    networks:
      - dokploy-network
      - default
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.performance-managment-system-backend-pwhfoc-6-web.rule=Host(`bkpms.zainx.cloud`)
      - traefik.http.routers.performance-managment-system-backend-pwhfoc-6-web.entrypoints=web
      - traefik.http.services.performance-managment-system-backend-pwhfoc-6-web.loadbalancer.server.port=7860
      - traefik.http.routers.performance-managment-system-backend-pwhfoc-6-web.service=performance-managment-system-backend-pwhfoc-6-web
      - traefik.http.routers.performance-managment-system-backend-pwhfoc-6-web.middlewares=redirect-to-https@file
      - traefik.http.routers.performance-managment-system-backend-pwhfoc-6-websecure.rule=Host(`bkpms.zainx.cloud`)
      - traefik.http.routers.performance-managment-system-backend-pwhfoc-6-websecure.entrypoints=websecure
      - traefik.http.services.performance-managment-system-backend-pwhfoc-6-websecure.loadbalancer.server.port=7860
      - traefik.http.routers.performance-managment-system-backend-pwhfoc-6-websecure.service=performance-managment-system-backend-pwhfoc-6-websecure
      - traefik.http.routers.performance-managment-system-backend-pwhfoc-6-websecure.tls.certresolver=letsencrypt
      - traefik.enable=true
      - dokploy.organization.id=fHpOQZBWg5ovFVXv43-rO
      - dokploy.project.id=5ZhN_93WVKALyaZi8gUYg
      - dokploy.project=Performance Managment System
      - dokploy.environment.id=UfSrbdaM5u87u4LjRB13I
      - dokploy.environment=production
      - dokploy.application.id=uncof75r2DnwMD4KV5hed
      - dokploy.application=Backend
      - dokploy.service=backend
  worker:
    build:
      context: .
      dockerfile: DevOps/docker/Dockerfile.backend
    command:
      - sh
      - -c
      - exec python worker.py
    environment: *a1
    volumes:
      - job_data:/app/job_data
    # Do not start the API or job worker until database migrations have succeeded.
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - scripts.worker_healthcheck
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - dokploy-network
      - default
    labels:
      - dokploy.organization.id=fHpOQZBWg5ovFVXv43-rO
      - dokploy.project.id=5ZhN_93WVKALyaZi8gUYg
      - dokploy.project=Performance Managment System
      - dokploy.environment.id=UfSrbdaM5u87u4LjRB13I
      - dokploy.environment=production
      - dokploy.application.id=uncof75r2DnwMD4KV5hed
      - dokploy.application=Backend
      - dokploy.service=worker
networks:
  dokploy-network:
    external: true
  default: null
volumes:
  redis_data: null
  job_data: null
