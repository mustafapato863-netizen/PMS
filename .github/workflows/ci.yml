name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:ci

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate operational shell scripts
        run: bash -n DevOps/scripts/*.sh
      - name: Validate production Compose configuration
        run: docker compose --env-file DevOps/.env.hostinger.example -f compose.production.yml config --quiet
      - name: Build production images
        run: docker compose --env-file DevOps/.env.hostinger.example -f compose.production.yml build backend frontend
