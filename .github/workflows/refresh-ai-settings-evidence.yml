name: Refresh PMS evidence for AI settings migration fix
on:
  push:
    branches:
      - fix/ai-settings-product-value-migration
permissions:
  contents: write
jobs:
  refresh-generated-evidence:
    if: github.repository == 'mustafapato863-netizen/PMS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ai-settings-product-value-migration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate deterministic source evidence
        run: |
          python3 evaluation/pms-ai/phase2/generate_coverage_manifest.py
          python3 evaluation/pms-ai/phase0/inventory_test_types.py
      - name: Commit generated artifacts on PR branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evaluation/pms-ai/phase2/coverage_manifest.json
          git add evaluation/pms-ai/phase2/coverage_matrix.csv
          git add evaluation/pms-ai/phase2/coverage_report.md
          git add evaluation/pms-ai/phase0/test_type_inventory.json
          git add evaluation/pms-ai/phase0/TEST_TYPE_INVENTORY.md
          if git diff --cached --quiet; then
            echo 'Evidence already matches source'
            exit 0
          fi
          git commit -m 'test(ai): refresh checked-in coverage evidence'
          git push origin HEAD:fix/ai-settings-product-value-migration
