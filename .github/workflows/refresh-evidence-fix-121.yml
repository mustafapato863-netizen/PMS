name: Refresh generated PMS evidence (PR 121 only)
on:
  push:
    branches: [fix/nov18-ai-pulse-regression-gates]
permissions:
  contents: write
jobs:
  refresh-evidence:
    if: github.repository == 'mustafapato863-netizen/PMS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/nov18-ai-pulse-regression-gates
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate source-derived coverage and unsigned Phase 0 evidence
        run: |
          python3 evaluation/pms-ai/phase2/generate_coverage_manifest.py
          python3 evaluation/pms-ai/phase0/inventory_test_types.py
          python3 evaluation/pms-ai/phase0/derive_expected.py
      - name: Commit deterministic evidence only on PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evaluation/pms-ai/phase2/coverage_manifest.json
          git add evaluation/pms-ai/phase2/coverage_matrix.csv
          git add evaluation/pms-ai/phase2/coverage_report.md
          git add evaluation/pms-ai/phase0/test_type_inventory.json
          git add evaluation/pms-ai/phase0/TEST_TYPE_INVENTORY.md
          git add evaluation/pms-ai/phase0/frozen_v1.json
          git add evaluation/pms-ai/phase0/heldout_v1.json
          git add evaluation/pms-ai/phase0/derivation_report.json
          git add evaluation/pms-ai/phase0/DERIVATION.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(ai): update deterministic Phase 0 and coverage evidence'
          git push origin HEAD:fix/nov18-ai-pulse-regression-gates
