# Dokploy (docker-compose.yml on push to main) is the live deploy path.
# This workflow is manual-only. Running it on the Dokploy VPS would duplicate
# the stack: Caddy against Traefik on ports 80/443, plus a second backend,
# worker, redis, and frontend.
name: Deploy to Hostinger VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy production Compose project
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: pms-dashboard
          docker-compose-path: compose.production.yml
          environment-variables: |
            APP_DOMAIN=${{ vars.APP_DOMAIN }}
            ACME_EMAIL=${{ vars.ACME_EMAIL }}
            APP_VERSION=${{ github.event.workflow_run.head_sha || github.sha }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DATABASE_POOL_SIZE=10
            DATABASE_MAX_OVERFLOW=5
            DATABASE_POOL_TIMEOUT=10
            DATABASE_POOL_RECYCLE=1800
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            CORS_ALLOWED_ORIGINS=https://${{ vars.APP_DOMAIN }}
            JWT_ALGORITHM=HS256
            JWT_EXPIRE_MINUTES=1440
            PMS_REALTIME_MODE=in_process
            VITE_REALTIME_ENABLED=true
            MAX_UPLOAD_BYTES=26214400
            LOG_LEVEL=INFO
            PMS_AI_LLM_BASE_URL=${{ vars.PMS_AI_LLM_BASE_URL || 'http://pms-qwen-pilot:8080' }}
            PMS_AI_LLM_MODEL=${{ vars.PMS_AI_LLM_MODEL || 'qwen3-4b-q4_k_m' }}
            PMS_AI_LLM_API_KEY=${{ secrets.PMS_AI_LLM_API_KEY }}
            PMS_AI_LLM_ALLOWED_HOSTS=${{ vars.PMS_AI_LLM_ALLOWED_HOSTS || 'localhost,127.0.0.1,::1,llm,pms-qwen-pilot,host.docker.internal' }}
            PMS_AI_LLM_INTENT_ENABLED=${{ vars.PMS_AI_LLM_INTENT_ENABLED || 'false' }}
            PMS_AI_LLM_SYNTHESIS_ENABLED=${{ vars.PMS_AI_LLM_SYNTHESIS_ENABLED || 'false' }}
            PMS_AI_LLM_EXPLORATION_ENABLED=false
            PMS_AI_LLM_TIMEOUT_SECONDS=${{ vars.PMS_AI_LLM_TIMEOUT_SECONDS || '15' }}
            PMS_AI_LLM_SYNTHESIS_TIMEOUT_SECONDS=${{ vars.PMS_AI_LLM_SYNTHESIS_TIMEOUT_SECONDS || '30' }}
            PMS_AI_LLM_MAX_CALLS_PER_TURN=${{ vars.PMS_AI_LLM_MAX_CALLS_PER_TURN || '3' }}
            PMS_AI_LLM_CONTEXT=${{ vars.PMS_AI_LLM_CONTEXT || '2048' }}
            PMS_RATE_LIMIT_AI_CHAT_PER_MINUTE=${{ vars.PMS_RATE_LIMIT_AI_CHAT_PER_MINUTE || '20' }}
