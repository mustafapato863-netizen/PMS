name: Deploy to Hostinger VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy production Compose project
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: pms-dashboard
          docker-compose-path: compose.production.yml
          environment-variables: |
            APP_DOMAIN=${{ vars.APP_DOMAIN }}
            ACME_EMAIL=${{ vars.ACME_EMAIL }}
            APP_VERSION=${{ github.event.workflow_run.head_sha || github.sha }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DATABASE_POOL_SIZE=5
            DATABASE_MAX_OVERFLOW=0
            DATABASE_POOL_RECYCLE=1800
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            CORS_ALLOWED_ORIGINS=https://${{ vars.APP_DOMAIN }}
            JWT_ALGORITHM=HS256
            JWT_EXPIRE_MINUTES=1440
            PMS_REALTIME_MODE=in_process
            VITE_REALTIME_ENABLED=true
            MAX_UPLOAD_BYTES=26214400
            LOG_LEVEL=INFO
